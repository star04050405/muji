<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MUJI 良品食单 · 零食与食品</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="良品食单">
<meta name="theme-color" content="#F4F2EB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#F4F2EB; --ink:#241F1B; --dim:#8C867C; --line:#DDD8CC;
  --red:#7F0019; --card:#FFFFFF;
  --sans:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);max-width:760px;margin:0 auto;padding:0 14px 110px;-webkit-font-smoothing:antialiased}
header{padding:46px 4px 0;display:flex;align-items:flex-start;justify-content:space-between}
.logo .muji{font-size:34px;font-weight:800;letter-spacing:.02em;line-height:1}
.logo .kanji{font-size:12.5px;font-weight:700;letter-spacing:.42em;margin-top:4px}
.logo .en{font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:6px}
.brandline{width:46px;height:46px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;writing-mode:vertical-rl;flex:none}
.intro{margin-top:26px;padding:0 4px}
.intro h1{font-size:21px;letter-spacing:.06em;font-weight:700}
.intro p{font-size:12px;color:var(--dim);line-height:1.9;margin-top:8px}
.tabs{display:flex;gap:0;margin-top:22px;border-bottom:2px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:13px;font-weight:700;letter-spacing:.08em;padding:11px 15px;color:var(--dim);cursor:pointer;border:none;background:none;position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--red)}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;transition:box-shadow .2s}
.card:active{box-shadow:0 4px 18px rgba(36,31,27,.12)}
.card .ph{aspect-ratio:1;background:#EDEAE2;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;letter-spacing:.2em}
.card img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1}
.card .info{padding:10px 12px 12px;border-top:1px solid #EFECE4}
.card .cat{font-size:9px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.card .nm{font-size:13.5px;font-weight:700;margin-top:4px;line-height:1.5}
.card .pr{font-size:14px;font-weight:800;color:var(--red);margin-top:5px}
.card .pr small{font-size:9px;font-weight:400;color:var(--dim);letter-spacing:.1em;margin-left:4px}
.want{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim)}
.want.on{background:var(--red);border-color:var(--red);color:#fff}
/* 底部购物清单栏 */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--ink);color:#F4F2EB;display:flex;align-items:center;gap:14px;padding:13px 18px calc(13px + env(safe-area-inset-bottom))}
.cartbar .cnt{font-size:12px;letter-spacing:.1em;flex:1}
.cartbar .cnt b{font-size:16px;margin:0 3px}
.cartbar .sum{font-size:15px;font-weight:800}
.cartbar .sum i{font-style:normal;font-size:10px;font-weight:400;color:#B9B3A7;margin-right:3px}
.cartbar button{background:var(--red);color:#fff;border:none;border-radius:5px;padding:9px 16px;font-size:12px;font-weight:700;letter-spacing:.12em;cursor:pointer}
/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(36,31,27,.45);z-index:900;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:910;background:var(--bg);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.3,1,.4,1);max-height:88vh;overflow-y:auto}
.drawer.show{transform:none}
.d-in{padding:18px 18px 30px;max-width:560px;margin:0 auto}
.d-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.d-in img{width:100%;max-height:46vh;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.d-in .cat{font-size:9.5px;letter-spacing:.24em;color:var(--dim);margin-top:14px}
.d-in h2{font-size:19px;margin-top:5px;line-height:1.5}
.d-in .pr{font-size:21px;font-weight:800;color:var(--red);margin-top:6px}
.d-in .pr small{font-size:10px;font-weight:400;color:var(--dim);margin-left:5px}
.d-in p.desc{font-size:13px;color:#5C564D;line-height:2;margin-top:12px}
.d-act{display:flex;gap:10px;margin-top:18px}
.d-act button{flex:1;padding:13px;border-radius:8px;font-size:13.5px;font-weight:700;letter-spacing:.1em;border:none;cursor:pointer}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:none;border:1px solid var(--ink)!important;color:var(--ink)}
footer{margin-top:40px;padding:0 4px;font-size:10px;color:var(--dim);line-height:2;letter-spacing:.06em}
@media(min-width:600px){.shelf{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="muji">MUJI</div>
    <div class="kanji">無印良品</div>
    <div class="en">GOODS · FOOD & SNACK</div>
  </div>
  <div class="brandline">良品食单</div>
</header>
<div class="intro">
  <h1>零食与食品 · 货架</h1>
  <p>从网红棉花糖到咖喱调理包，22 件常被反复回购的无印食品。价格为中国内地门店参考零售价，以门店与官方渠道实际标价为准。</p>
</div>
<div class="tabs" id="tabs"></div>
<div class="shelf" id="shelf"></div>
<footer>/// 图片为网络实物参考图，包装以门店在售版本为准 · 价格仅供参考<br>/// 良品食单 · 想吃清单保存在本机</footer>
<div class="cartbar" id="cartbar">
  <span class="cnt">想吃清单 <b id="cartN">0</b> 件</span>
  <span class="sum"><i>约</i>¥<span id="cartSum">0</span></span>
  <button onclick="clearCart()">清空</button>
</div>
<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><div class="d-in" id="dIn"><div class="d-grab"></div></div></div>
<script>
const CATS = [["all","全部"],["candy","糖果巧克力"],["bake","饼干膨化"],["tea","茶饮"],["meal","速食调理"],["dry","果干坚果"],["sweet","甜品冰品"]];
const ITEMS = [
 {id:"candy_mash", cat:"candy", nm:"葡萄味软糖", pr:15, d:"酸甜葡萄味软糖，小袋独立包装，办公室抽屉常备款。"},
 {id:"candy_gummy", cat:"candy", nm:"助眠软糖 GABA", pr:18, d:"含 GABA 功能性成分的网红软糖，白葡萄味，睡前一袋的仪式感。"},
 {id:"choco_wafer", cat:"candy", nm:"巧克力龙", pr:12, d:"红袋圈圈造型巧克力脆脆，酸奶涂层款，一口一个停不下来。"},
 {id:"choco_square", cat:"candy", nm:"巧克力曲奇盒", pr:22, d:"黑白极简盒装的巧克力曲奇，配巧克力夹心球，送礼体面自留过瘾。"},
 {id:"candy_kanro", cat:"candy", nm:"罐装金平糖", pr:15, d:"玻璃罐装的星星糖，复古感和菓子，撒在甜品上超可爱。"},
 {id:"chip_potato", cat:"bake", nm:"薯片（淡盐味）", pr:12, d:"薄切土豆片只调味海盐，酥脆不油腻，MUJI 零食人气王。"},
 {id:"rice_cracker", cat:"bake", nm:"墨鱼味仙贝脆片", pr:12, d:"墨鱼汁染黑的日式仙贝脆片，咸鲜酥脆，颜值与口味都出圈。"},
 {id:"cookie_butter", cat:"bake", nm:"黄油曲奇罐", pr:45, d:"北海道风黄油曲奇，酥到掉渣，罐装送人自留两相宜。"},
 {id:"cookie_butterfly", cat:"bake", nm:"鸡蛋蛋卷（盒装）", pr:25, d:"添加整颗鸡蛋的四味蛋卷，蛋香四溢，酥脆掉渣，茶歇标配。"},
 {id:"snack_eggrand", cat:"bake", nm:"豆乳蛋卷小袋", pr:18, d:"豆乳风味蛋卷独立小袋装，包里随手抓一根的早餐救急款。"},
 {id:"tea_bag", cat:"tea", nm:"豆乳红茶茶包", pr:32, d:"豆香与红茶平衡的经典款，冷泡热泡都好喝。"},
 {id:"tea_royal", cat:"tea", nm:"熔茶牛乳奶茶", pr:15, d:"焙茶风味奶茶粉，温水一冲即得，甜度温和的日式奶茶。"},
 {id:"noodle_ramen", cat:"meal", nm:"豆奶鸡汤汤面", pr:15, d:"温和豆乳鸡汤汤底，五分钟煮出一碗日式暖胃面。"},
 {id:"noodle_dandan", cat:"meal", nm:"四川担担面", pr:15, d:"微辣芝麻担担面，泡煮两可，深夜食堂人气速食。"},
 {id:"curry_retort", cat:"meal", nm:"咖喱调理包", pr:25, d:"鸡肉/牛肉/蔬菜多口味，倒在米饭上三分钟还原店内咖喱。"},
 {id:"soup_freeze", cat:"meal", nm:"冻干速食汤", pr:15, d:"味噌汤/洋葱汤等多口味冻干汤，热水一冲即成。"},
 {id:"nut_mixed", cat:"dry", nm:"无糖混合坚果", pr:29, d:"不加糖盐的腰果杏仁核桃混合，健康零食区扛把子。"},
 {id:"dry_mango", cat:"dry", nm:"无糖芒果干", pr:19, d:"只烘干不加糖，酸香浓郁，果干区必买。"},
 {id:"dry_banana", cat:"bake", nm:"抹茶夹心薄饼", pr:22, d:"宇治抹茶夹心的法式薄饼，16 枚入，茶味微苦平衡甜度。"},
 {id:"jelly_cup", cat:"sweet", nm:"白桃果汁果冻", pr:12, d:"挤出式果汁果冻，白桃味最热门，夏日解暑神器。"},
 {id:"yokan_bean", cat:"sweet", nm:"巧克力羊羹", pr:18, d:"传统羊羹与巧克力的融合版，冷藏后切块吃风味最佳。"},
 {id:"snack_icecream", cat:"sweet", nm:"熔茶布丁", pr:12, d:"焙茶风味熔岩布丁，冷藏柜人气甜品，入口即化。"}
];
const CATN = {}; CATS.forEach(c=>CATN[c[0]]=c[1]);
const KEY="muji_want";
let want = JSON.parse(localStorage.getItem(KEY)||"{}");
let curCat = "all";
function save(){ localStorage.setItem(KEY, JSON.stringify(want)); }
function renderTabs(){
  document.getElementById("tabs").innerHTML = CATS.map(c=>
    `<button class="tab ${curCat===c[0]?"on":""}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join("");
}
function setCat(c){ curCat=c; renderTabs(); renderShelf(); }
function renderShelf(){
  const list = ITEMS.filter(i=>curCat==="all"||i.cat===curCat);
  document.getElementById("shelf").innerHTML = list.map(i=>`
   <div class="card" onclick="openDrawer('${i.id}')">
     <img src="img/${i.id}.jpg" alt="${i.nm}" loading="lazy" onerror="this.outerHTML='<div class=ph>良品</div>'">
     <div class="want ${want[i.id]?"on":""}" onclick="event.stopPropagation();toggleWant('${i.id}')">${want[i.id]?"♥":"♡"}</div>
     <div class="info">
       <div class="cat">${CATN[i.cat]}</div>
       <div class="nm">${i.nm}</div>
       <div class="pr">¥${i.pr}<small>参考价</small></div>
     </div>
   </div>`).join("");
  renderCart();
}
function toggleWant(id){
  want[id] = !want[id]; save(); renderShelf();
  if(want[id]) toast("已加入想吃清单");
}
function openDrawer(id){
  const i = ITEMS.find(x=>x.id===id);
  document.getElementById("dIn").innerHTML = `
   <div class="d-grab"></div>
   <img src="img/${i.id}.jpg" alt="${i.nm}" onerror="this.style.display='none'">
   <div class="cat">${CATN[i.cat]} · MUJI 無印良品</div>
   <h2>${i.nm}</h2>
   <div class="pr">¥${i.pr}<small>参考零售价 · 以门店实际为准</small></div>
   <p class="desc">${i.d}</p>
   <div class="d-act">
     <button class="btn-red" onclick="toggleWant('${i.id}');closeDrawer()">${want[i.id]?"从清单移除":"想吃，加入清单"}</button>
     <button class="btn-ghost" onclick="closeDrawer()">继续逛</button>
   </div>`;
  document.getElementById("drawer").classList.add("show");
  document.getElementById("mask").classList.add("show");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("mask").classList.remove("show");
}
function renderCart(){
  const ids = Object.keys(want).filter(k=>want[k]);
  document.getElementById("cartN").textContent = ids.length;
  document.getElementById("cartSum").textContent = ids.reduce((s,id)=>s+ITEMS.find(x=>x.id===id).pr,0);
}
function clearCart(){ want={}; save(); renderShelf(); }
let toastTimer;
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast";
    t.style.cssText="position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#241F1B;color:#F4F2EB;font-size:12px;letter-spacing:.1em;padding:9px 18px;border-radius:99px;z-index:950;opacity:0;transition:opacity .3s";
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.style.opacity=0, 1500);
}
renderTabs(); renderShelf();
</script>
</body>
</html>
